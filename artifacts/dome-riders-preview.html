<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dome Riders ornament · layered design draft</title>
  <style>
    :root { color-scheme: light; font-family: Segoe UI, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #f3f4f6; color: #17212b; }
    main { width: min(96vw, 1500px); margin: 1rem auto; text-align: center; }
    .compare { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; align-items: start; }
    figure { margin: 0; padding: .8rem; background: white; border-radius: .6rem; box-shadow: 0 1px 5px #17212b22; }
    figure img { display: block; width: 100%; aspect-ratio: 1; object-fit: contain; }
    .art { position: relative; width: 100%; aspect-ratio: 1; }
    .art img { position: absolute; inset: 8.333333%; width: 83.333333%; height: 83.333333%; object-fit: contain; }
    .art img.hanging-tab { inset: 0; width: 100%; height: 100%; }
    .art img[hidden] { display: none; }
    .layer-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem 1rem; margin: 0 0 1rem; }
    .layer-controls label { white-space: nowrap; }
    figcaption { padding: .5rem 0 .1rem; font-weight: 600; }
    p { margin: .8rem 0 1rem; color: #495564; }
    strong { color: #9a5b00; }
    @media (max-width: 720px) { .compare { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <fieldset class="layer-controls">
      <legend>Show or hide individual design layers</legend>
      <label><input type="checkbox" data-layer="rays" checked> Rays</label>
      <label><input type="checkbox" data-layer="water" checked> Water</label>
      <label><input type="checkbox" data-layer="aircraft" checked> Aircraft</label>
      <label><input type="checkbox" data-layer="palm" checked> Palm</label>
      <label><input type="checkbox" data-layer="sailboat" checked> Sailboat</label>
      <label><input type="checkbox" data-layer="hanging-tab" checked> Hanging tab</label>
    </fieldset>
    <div class="compare">
      <figure>
        <img src="reference-patch-crop.png" alt="Original patch photo reference">
        <figcaption>Original patch photo</figcaption>
      </figure>
      <figure>
        <div class="art">
          <img src="layers/01-rim-lettering.svg" alt="Locked rim and lettering layer">
          <img src="layers/02-sun-rays.svg" alt="Sun-and-rays layer" data-design-layer="rays">
          <img src="layers/03-water.svg" alt="Five monochrome spectrum-style water waves" data-design-layer="water">
          <img src="layers/04-aircraft-refined.svg" alt="Refined E-2D Hawkeye aircraft silhouette and radar dome" data-design-layer="aircraft">
          <img src="layers/05-palm-refined.svg" alt="Proportion-refined left-side palm silhouette" data-design-layer="palm">
          <img src="layers/06-sailboat-refined.svg" alt="Proportion-refined right-side sailboat silhouette" data-design-layer="sailboat">
          <img src="layers/07-hanging-tab.svg" class="hanging-tab" alt="Hanging tab with a 4 mm hole" data-design-layer="hanging-tab">
        </div>
        <figcaption>Layered draft · 100 mm body with proposed hanging tab</figcaption>
      </figure>
    </div>
    <p><strong>Design composition only:</strong> The separate hanging tab projects approximately 9 mm beyond the planned 100 mm body and has a 4 mm hole. The draft is shown smaller than the reference to accommodate the tab. This is not a toolpath or depth simulation.</p>
  </main>
  <script>
    document.querySelectorAll("[data-layer]").forEach((control) => {
      control.addEventListener("change", () => {
        document.querySelectorAll(`[data-design-layer="${control.dataset.layer}"]`).forEach((layer) => {
          layer.hidden = !control.checked;
        });
      });
    });
  </script>
</body>
</html>

[project]
name = "ttc3018-control"
version = "0.1.0"
description = "A safety-focused GRBL controller for the Two Trees TTC 3018"
requires-python = ">=3.14"
dependencies = ["pyserial==3.5", "PySide6==6.10.2", "cadquery-ocp==7.9.3.1.1", "shapely==2.1.2"]

[project.scripts]
ttc3018-control = "ttc3018_control.qt.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]


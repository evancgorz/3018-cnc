[project]
name = "ttc3018-control"
version = "0.1.0"
description = "Pine, a safety-focused desktop CNC studio for GRBL machines"
requires-python = ">=3.14"
dependencies = ["pyserial==3.5", "PySide6==6.10.2", "cadquery-ocp==7.9.3.1.1", "shapely==2.1.2", "qrcode==8.2", "Pillow==11.3.0"]

[project.optional-dependencies]
test = ["coverage==7.10.6"]

[project.scripts]
ttc3018-control = "ttc3018_control.qt.main:main"
pine-cnc = "ttc3018_control.qt.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ttc3018_control.simulation"]
concurrency = ["multiprocessing"]
parallel = true

